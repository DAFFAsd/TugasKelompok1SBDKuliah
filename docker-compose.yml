version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
  backend:
    build:
      context : ./backend
      dockerfile: Dockerfile
      no_cache: true
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/markdown_db
      - PORT=5000
      - CLOUDINARY_CLOUD_NAME=dnkkk7pgw
      - CLOUDINARY_API_KEY=612347442264637
      - CLOUDINARY_API_SECRET=tbXNmU3pq5kvXWa0tttRWevUChE
      - DATABASE_URL='postgresql://digilearn_owner:npg_yCXzw8Tr6Hqk@ep-small-shape-a1hdthfg-pooler.ap-southeast-1.aws.neon.tech/digilearn?sslmode=require'
      - JWT_SECRET='technoskill_workshop_secret_key_2024'
      - NODE_ENV=development
      - MONGODB_URL=localhost:27017
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      no_cache: true
    container_name: frontend
    restart: always
    ports:
      - "2000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api
      
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:

